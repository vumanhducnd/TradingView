name: Update OHLCV to Neon

on:
  # Tắt schedule — live_in_session.yml đã update VN100 real-time trong phiên
  # Bật lại nếu cần sync toàn bộ 1411 mã
  # schedule:
  #   - cron: '0 8 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync OHLCV
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python sync_ohlcv.py
