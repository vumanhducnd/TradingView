name: Update OHLCV to Neon

on:
  # Tắt schedule — live_in_session.yml đã update VN100 real-time trong phiên
  # Bật lại nếu cần sync toàn bộ 1411 mã
  # schedule:
  #   - cron: '0 8 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync OHLCV
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          VNSTOCK_SOURCE:  ${{ vars.VNSTOCK_SOURCE }}
          VNSTOCK_SOURCE_OHLCV: ${{ vars.VNSTOCK_SOURCE_OHLCV }}
          VNSTOCK_SOURCE_QUOTE: ${{ vars.VNSTOCK_SOURCE_QUOTE }}
          VNSTOCK_SOURCE_INDEX: ${{ vars.VNSTOCK_SOURCE_INDEX }}
          VNSTOCK_SOURCE_FOREIGN_ROOM: ${{ vars.VNSTOCK_SOURCE_FOREIGN_ROOM }}
          VNSTOCK_SOURCE_REFERENCE: ${{ vars.VNSTOCK_SOURCE_REFERENCE }}
          DNSE_API_KEY:             ${{ secrets.DNSE_API_KEY }}
          DNSE_API_SECRET:          ${{ secrets.DNSE_API_SECRET }}
        run: python sync_ohlcv.py
