name: Live Pre-session Scan (08:00 GMT+7)

on:
  schedule:
    # 01:00 UTC = 08:00 ICT (GMT+7), thứ 2–6
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass kiem tra gio (de test)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-session:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # tối đa 2h chờ + 5 phút chạy thực

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Báo cáo đầu phiên VN100
        env:
          TELEGRAM_BOT_TOKEN_LONG:  ${{ secrets.TELEGRAM_BOT_TOKEN_LONG }}
          TELEGRAM_CHAT_ID_LONG:    ${{ secrets.TELEGRAM_CHAT_ID_LONG }}
          TELEGRAM_BOT_TOKEN_SHORT: ${{ secrets.TELEGRAM_BOT_TOKEN_SHORT }}
          TELEGRAM_CHAT_ID_SHORT:   ${{ secrets.TELEGRAM_CHAT_ID_SHORT }}
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY:    ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m scanner.live_scanner --mode pre --force
          else
            python -m scanner.live_scanner --mode pre
          fi
