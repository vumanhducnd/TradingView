name: Live Pre-session Scan (8:30 ICT)

on:
  schedule:
    # 00:30 UTC = 07:30 ICT (GMT+7), thứ 2–6
    # Chạy sớm 1 tiếng — Python tự _wait_until_ict(8,30), bỏ qua nếu quá 9:15
    - cron: '30 0 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pre-session:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # tối đa 2h chờ + 5 phút chạy thực

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Báo cáo đầu phiên VN100
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY:    ${{ secrets.VNSTOCK_API_KEY }}
        run: python -m scanner.live_scanner --mode pre
