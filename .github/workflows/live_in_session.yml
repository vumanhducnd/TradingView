name: Live In Session (09:00-14:45 GMT+7)

# Chia 2 phien: Sang 9:00-11:30 va Chieu 13:00-14:45 (moi job < 3h < 6h free tier)
# Trigger boi cron-job.org qua workflow_dispatch chinh xac hon GitHub cron

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Phien: morning (9:00-11:30) | afternoon (13:00-14:45) | full'
        required: false
        default: 'morning'
        type: choice
        options: ['morning', 'afternoon', 'full']
      interval:
        description: 'Phut giua moi lan quet (default: 3)'
        required: false
        default: '3'
      force:
        description: 'Chay 1 cycle de test (bo qua kiem tra gio giao dich)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # ~3h30m du cho ca 2 phien

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run session scanner
        env:
          TELEGRAM_BOT_TOKEN_LONG:  ${{ secrets.TELEGRAM_BOT_TOKEN_LONG }}
          TELEGRAM_CHAT_ID_LONG:    ${{ secrets.TELEGRAM_CHAT_ID_LONG }}
          TELEGRAM_BOT_TOKEN_SHORT: ${{ secrets.TELEGRAM_BOT_TOKEN_SHORT }}
          TELEGRAM_CHAT_ID_SHORT:   ${{ secrets.TELEGRAM_CHAT_ID_SHORT }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY:          ${{ secrets.VNSTOCK_API_KEY }}
          SLACK_WEBHOOK_URL:        ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SESSION=${{ inputs.session || 'morning' }}
          INTERVAL=${{ inputs.interval || '3' }}
          FORCE=${{ inputs.force || 'false' }}
          if [ "$FORCE" = "true" ]; then
            python -m scanner.live_scanner --mode session --session $SESSION --interval $INTERVAL --force
          else
            python -m scanner.live_scanner --mode session --session $SESSION --interval $INTERVAL
          fi
