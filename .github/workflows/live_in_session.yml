name: Live Session Scanner (9:00–14:45 ICT)

# Job B: được trigger bởi live_wait.yml lúc 9:00 ICT
# Quét từ 9:00 đến 14:45 ICT = 5h45m = 345 phút < 6h free tier limit
# Không có cron — chỉ chạy qua workflow_dispatch từ live_wait.yml

on:
  workflow_dispatch:
    inputs:
      interval:
        description: 'Phút giữa mỗi lần quét (default: 3)'
        required: false
        default: '3'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h — đủ cho 5h45m scan + setup (free tier limit)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run session scanner
        env:
          TELEGRAM_BOT_TOKEN_LONG:  ${{ secrets.TELEGRAM_BOT_TOKEN_LONG }}
          TELEGRAM_CHAT_ID_LONG:    ${{ secrets.TELEGRAM_CHAT_ID_LONG }}
          TELEGRAM_BOT_TOKEN_SHORT: ${{ secrets.TELEGRAM_BOT_TOKEN_SHORT }}
          TELEGRAM_CHAT_ID_SHORT:   ${{ secrets.TELEGRAM_CHAT_ID_SHORT }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY:          ${{ secrets.VNSTOCK_API_KEY }}
          SLACK_WEBHOOK_URL:        ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          INTERVAL=${{ inputs.interval || '3' }}
          python -m scanner.live_scanner --mode session --interval $INTERVAL
