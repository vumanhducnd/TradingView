name: Update Cuoi Phien (15:00 GMT+7)

on:
  schedule:
    # 08:03 UTC = 15:03 GMT+7, thu 2-6 (sau ATC, gia on dinh)
    - cron: '3 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan (bo qua kiem tra ngay nghi)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN_LONG:  ${{ secrets.TELEGRAM_BOT_TOKEN_LONG }}
          TELEGRAM_CHAT_ID_LONG:    ${{ secrets.TELEGRAM_CHAT_ID_LONG }}
          TELEGRAM_BOT_TOKEN_SHORT: ${{ secrets.TELEGRAM_BOT_TOKEN_SHORT }}
          TELEGRAM_CHAT_ID_SHORT:   ${{ secrets.TELEGRAM_CHAT_ID_SHORT }}
          DATABASE_URL:             ${{ secrets.DATABASE_URL }}
          VNSTOCK_API_KEY:          ${{ secrets.VNSTOCK_API_KEY }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python -m scanner.updater --scan-only --force
          else
            python -m scanner.updater --scan-only
          fi

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          git diff --staged --quiet || git commit -m "scan: $(date -u +%Y-%m-%d) auto"
          git push
