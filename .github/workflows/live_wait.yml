name: Live Wait (trigger session at 9:00 ICT)

# Job A: chạy lúc 8:00 ICT, chờ đến 9:00 rồi trigger live_session.yml
# Tổng thời gian job A: ~1h → nằm trong 6h free tier

on:
  schedule:
    # 01:00 UTC = 08:00 ICT (GMT+7), thứ 2–6
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wait-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # tối đa 2h cho phần chờ + buffer

    steps:
      - name: Wait until 09:00 ICT then trigger session scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_UTC="02:00"   # 09:00 ICT = 02:00 UTC
          echo "Waiting until ${TARGET_UTC} UTC (09:00 ICT)..."
          while true; do
            NOW=$(date -u +%H:%M)
            if [[ "$NOW" >= "$TARGET_UTC" ]]; then
              echo "It is ${NOW} UTC — triggering session scanner"
              break
            fi
            echo "  now=${NOW} UTC, waiting..."
            sleep 60
          done

      - name: Checkout (needed for gh cli)
        uses: actions/checkout@v4

      - name: Trigger live session scanner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run live_in_session.yml \
            --field interval=3
          echo "live_in_session.yml triggered successfully"
