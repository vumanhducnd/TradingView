name: Test Alternative APIs

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Test VNDirect finfo API
        run: |
          python - <<'EOF'
          import requests, json

          url = "https://finfo-api.vndirect.com.vn/v4/stock_prices"
          params = {
              "sort": "date",
              "q": "code:VIC,VHM,HPG,VNM,MSN~date:gte:2026-05-08",
              "size": 10,
          }
          try:
              r = requests.get(url, params=params, timeout=10)
              print("Status:", r.status_code)
              data = r.json()
              rows = data.get("data", [])
              print(f"Rows: {len(rows)}")
              if rows:
                  print("Sample:", json.dumps(rows[0], indent=2))
          except Exception as e:
              print("FAIL:", e)
          EOF

      - name: Test TCBS market overview (multi-ticker)
        run: |
          python - <<'EOF'
          import requests, json

          # TCBS stock screen / list endpoint
          url = "https://apipubaws.tcbs.com.vn/stock-insight/v1/stock/second-chart"
          params = {"ticker": "VIC,VHM,HPG", "type": "stock", "resolution": "D"}
          try:
              r = requests.get(url, params=params, timeout=10)
              print("TCBS Status:", r.status_code)
              print("Response:", r.text[:500])
          except Exception as e:
              print("TCBS FAIL:", e)
          EOF
