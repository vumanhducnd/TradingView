name: Refresh VN100 Watchlist

on:
  schedule:
    # Every Monday 9:00 AM UTC = 4:00 PM ICT
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh watchlist
        run: python -m scanner.data_fetcher --refresh-watchlist

      - name: Commit updated watchlist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.csv
          git diff --staged --quiet || git commit -m "watchlist: updated $(date -u +%Y-%m-%d)"
          git push
